workflow: agent_demo
version: 0.6

goal: |
  Real-LLM demo built on the v0.2 built-in skills (analyzer, reviewer).
  Step 1: analyzer reads a bug report and produces root cause + a candidate
  patch. Step 2: reviewer judges the patch — approved or request_changes.

state:
  bug_report:
    type: string
    required: true
  language:
    type: string
    default: python

nodes:
  - id: diagnose_and_propose
    goal: |
      Identify the root cause of the bug AND produce a minimal candidate patch
      that addresses it. The analyzer pattern fits: structured findings.
    input:
      bug_report: "{{state.bug_report}}"
      language: "{{state.language}}"
    uses: skill.analyzer
    output_schema:
      root_cause: string
      patch: string
      explanation: string
    verify:
      - type: rule
        assert: "output.data.patch != ''"

  - id: review
    goal: |
      Decide whether the proposed patch directly addresses the root cause and
      is safe to ship.
    needs: [diagnose_and_propose]
    input:
      artifact: "{{nodes.diagnose_and_propose.latest.output.data.patch}}"
      criteria: "{{nodes.diagnose_and_propose.latest.output.data.root_cause}}"
      context: "{{nodes.diagnose_and_propose.latest.output.data.explanation}}"
    uses: skill.reviewer
    output_schema:
      approved: boolean
      reasoning: string
      feedback: string
