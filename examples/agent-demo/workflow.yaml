workflow: agent_demo
version: 0.6

goal: |
  Real-LLM demo: two skill nodes do bug analysis and fix proposal,
  then a third reviews the proposal and decides if it ships.

state:
  bug_report:
    type: string
    required: true
  language:
    type: string
    default: python

nodes:
  - id: analyze
    goal: |
      Identify the most likely root cause of the reported bug.
      Be specific — name the function or operation, not a category.
    input:
      bug_report: "{{state.bug_report}}"
      language: "{{state.language}}"
    uses: skill.analyze
    output_schema:
      root_cause: string
      confidence: number
      evidence: string
    verify:
      - type: schema

  - id: propose_fix
    goal: |
      Propose a minimal, safe fix that addresses the root cause.
      Output a tiny code patch in unified diff format.
    needs: [analyze]
    input:
      bug_report: "{{state.bug_report}}"
      root_cause: "{{nodes.analyze.latest.output.data.root_cause}}"
      language: "{{state.language}}"
    uses: skill.propose_fix
    output_schema:
      patch: string
      explanation: string
      risk: string
    verify:
      - type: schema
      - type: rule
        assert: "output.data.patch != ''"

  - id: review
    goal: |
      Review the proposed fix. Decide whether it's ready to merge.
      Be skeptical — only approve if the patch directly addresses
      the root cause without obvious risks.
    needs: [propose_fix]
    input:
      bug_report: "{{state.bug_report}}"
      root_cause: "{{nodes.analyze.latest.output.data.root_cause}}"
      proposed_patch: "{{nodes.propose_fix.latest.output.data.patch}}"
      proposed_explanation: "{{nodes.propose_fix.latest.output.data.explanation}}"
    uses: skill.review
    output_schema:
      approved: boolean
      reasoning: string
    verify:
      - type: schema
