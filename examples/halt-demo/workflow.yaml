workflow: halt_demo
version: 0.6

goal: |
  Demonstrate halt behavior: a node retries up to max_attempts but never
  satisfies `until`, then the workflow halts with exit 2 for orchestrator /
  human handoff. After collect, validate exhausts retries and halts;
  publish should be skipped (upstream_halted).

state:
  request_id:
    type: string
    required: true

nodes:
  - id: collect
    goal: Collect the candidate artifact.
    input:
      request_id: "{{state.request_id}}"
    uses: tool.collect
    output_schema:
      artifact: string

  - id: validate
    goal: Validate the artifact. Always returns ok=false in this demo —
          will exhaust retries and halt the workflow.
    needs: [collect]
    input:
      artifact: "{{nodes.collect.latest.output.data.artifact}}"
    uses: tool.always_invalid
    output_schema:
      ok: boolean
      reason: string
    retry:
      until: "nodes.validate.latest.output.data.ok == true"
      max_attempts: 2
      feedback: "{{nodes.validate.latest.output.data.reason}}"

  - id: publish
    goal: Publish (only reached if validate passes — won't run in this demo).
    needs: [validate]
    uses: tool.collect
    output_schema:
      artifact: string
