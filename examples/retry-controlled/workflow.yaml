workflow: retry_controlled
version: 0.6

goal: |
  Deterministic, fully-controllable retry+verify+halt test.
  - The `produce` tool reads CAMFLOW_ATTEMPT and decides pass/fail based on
    state.pass_at_attempt — so the test author chooses exactly when retry
    converges.
  - state.pass_at_attempt > state.max_attempts forces retry exhaustion → halt.
  - state.pass_at_attempt <= state.max_attempts converges → success.

state:
  pass_at_attempt:
    type: integer
    required: true
  max_attempts:
    type: integer
    required: true

nodes:
  - id: produce
    goal: |
      Produce a value. The deterministic grader returns ok=true only when
      this attempt's number reaches pass_at_attempt.
    input:
      pass_at: "{{state.pass_at_attempt}}"
    uses: tool.gradeable
    output_schema:
      value: integer
      ok: boolean
      reason: string
    verify:
      - type: rule
        assert: "output.data.value >= 0"
    retry:
      until: "nodes.produce.latest.output.data.ok == true"
      max_attempts: "{{state.max_attempts}}"
      feedback: "{{nodes.produce.latest.output.data.reason}}"

  - id: finalize
    goal: Run only if produce converged.
    needs: [produce]
    when: "nodes.produce.latest.output.data.ok == true"
    input:
      result_value: "{{nodes.produce.latest.output.data.value}}"
    uses: tool.confirm
    output_schema:
      summary: string
