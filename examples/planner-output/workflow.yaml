workflow: python_bug_fix
version: 0.6
goal: 'Diagnose a Python bug from a stack trace, propose a minimal patch, and have
  a reviewer skill approve it before shipping.

  '
state:
  stack_trace:
    type: string
    required: true
  max_attempts:
    type: integer
    default: 3
nodes:
- id: diagnose
  goal: Analyze the stack trace and identify the root cause of the bug.
  uses: skill.diagnose
  input:
    stack_trace: '{{state.stack_trace}}'
  output_schema:
    root_cause: string
    suspect_file: string
    suspect_symbol: string
    summary: string
  verify:
  - type: schema
  - type: rule
    assert: output.data.root_cause != ''
- id: patch
  goal: Propose a minimal patch that fixes the diagnosed root cause.
  needs:
  - diagnose
  uses: skill.propose_patch
  input:
    root_cause: '{{nodes.diagnose.latest.output.data.root_cause}}'
    suspect_file: '{{nodes.diagnose.latest.output.data.suspect_file}}'
    suspect_symbol: '{{nodes.diagnose.latest.output.data.suspect_symbol}}'
    diagnosis_summary: '{{nodes.diagnose.latest.output.data.summary}}'
    reviewer_feedback: '{{retry.feedback?}}'
  output_schema:
    patch_diff: string
    rationale: string
  verify:
  - type: schema
  - type: rule
    assert: output.data.patch_diff != ''
- id: review
  goal: Decide whether the proposed patch is ready to ship.
  needs:
  - patch
  uses: skill.review_patch
  input:
    root_cause: '{{nodes.diagnose.latest.output.data.root_cause}}'
    patch_diff: '{{nodes.patch.latest.output.data.patch_diff}}'
    rationale: '{{nodes.patch.latest.output.data.rationale}}'
  output_schema:
    approved: boolean
    verdict: string
    feedback: string
  verify:
  - type: schema
  retry:
    target: patch
    until: nodes.review.latest.output.data.approved == true
    max_attempts: '{{state.max_attempts}}'
    feedback: '{{nodes.review.latest.output.data.feedback}}'
