workflow: retry_demo
version: 0.6

goal: |
  Retry demo: tester is flaky and fails the first 2 attempts, passes the 3rd.
  The test node retries itself (max 3) until passed=true. After convergence,
  summarize and end.

state:
  bug_report:
    type: string
    required: true
  max_attempts:
    type: integer
    default: 3

nodes:
  - id: analyze
    goal: Identify root cause from the bug report.
    input:
      bug_report: "{{state.bug_report}}"
    uses: tool.analyzer
    output_schema:
      root_cause: string
    verify:
      - type: schema

  - id: fix
    goal: Produce a patch addressing the root cause.
    needs: [analyze]
    input:
      root_cause: "{{nodes.analyze.latest.output.data.root_cause}}"
      feedback: "{{retry.feedback?}}"
    uses: tool.fixer
    output_schema:
      patch: string
      explanation: string
    verify:
      - type: schema
      - type: rule
        assert: "output.data.patch != ''"

  - id: test
    goal: Run the test suite against the patch.
    needs: [fix]
    input:
      patch: "{{nodes.fix.latest.output.data.patch}}"
    uses: tool.tester
    output_schema:
      passed: boolean
      feedback: string
    retry:
      until: "nodes.test.latest.output.data.passed == true"
      max_attempts: "{{state.max_attempts}}"
      feedback: "{{nodes.test.latest.output.data.feedback}}"

  - id: summarize
    goal: Summarize the resolved bug.
    needs: [test]
    when: "nodes.test.latest.output.data.passed == true"
    input:
      root_cause: "{{nodes.analyze.latest.output.data.root_cause}}"
      patch: "{{nodes.fix.latest.output.data.patch}}"
    uses: tool.summarizer
    output_schema:
      summary: string
