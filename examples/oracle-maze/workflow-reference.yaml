workflow: oracle_maze_solve
version: "1.1"

# Reference DAG: a plausible shape Planner might produce for this
# fixture's PROMPT.txt. The solver node is a skill so the agent can
# scan, probe iteratively, and decide a path. It then calls
# maze_submit (via the wrapper or curl directly). On rev 1 the
# oracle halts; auto-replan creates rev 2. If rev 2 returns a
# phrase_hint, the bounded retry submits the same path with that phrase.

goal: "Reach maze_status.solved=true on dag_revision >= 2 by inferring the hidden path through probes and submitting it."
on_halt: replan
max_replans: 1

context: |
  Original task: solve the camflow-blind-maze-oracle.
  Oracle base URL: $CAMFLOW_ORACLE_BASE_URL
  Session id:     $CAMFLOW_ORACLE_SESSION_ID
  Action set:     N, E, S, W
  Path length:    determined by maze_scan (varies by oracle session;
                  do NOT hardcode any specific value).
  Tool wrappers:  scripts/maze_{scan,probe,submit,status}.sh
  Each wrapper reads CAMFLOW_DAG_REVISION from env and emits a
  CamFlow envelope with data=<oracle response>.

  Important: the oracle deliberately halts the FIRST submit on
  dag_revision=1 even when the path is correct. The solve must
  come from dag_revision>=2 — either the operator runs
  `camflow replan`, or (Phase B) the workflow opts in via top-level
  `on_halt: replan` + `max_replans: 1` so runtime auto-replans
  after the controlled halt.

  Explicit halt envelopes bypass node retry and reach workflow-level
  replan. Non-halt submit feedback is different: if dag_revision>=2
  returns a phrase_hint, retry the submit once with phrase=<hint>.

nodes:
  - id: solver
    goal: "Scan the maze, probe to infer the path (length from maze_scan), and submit it. Report the inferred path so a replan can re-use it."
    steps:
      - "Run scripts/maze_scan.sh to read the authoritative path_length and exits."
      - "Use scripts/maze_probe.sh iteratively (depth-first style), sized to the maze_scan path_length, to narrow down each step of the path."
      - "Once a full path of the maze_scan-reported length is justified by the probes, call scripts/maze_submit.sh with that path."
      - "If the oracle responds with halt=true (expected on dag_revision=1), report status=fail with the inferred path in data so the replan can re-use it."
      - "If a dag_revision>=2 submit returns phrase_hint without halt=true, retry once with the same path and that phrase."
    run:
      skill: code_writer
    output_schema:
      path: array
      submit_response: string
    verify:
      command: |
        # Verify only succeeds when the oracle reports solved=true.
        bash scripts/maze_status.sh > maze_status_verify.json
        python3 - <<'PY'
        import json
        with open("maze_status_verify.json") as f:
            env = json.load(f)
        raise SystemExit(0 if env.get("data", {}).get("solved") is True else 1)
        PY
    retry: 1

  - id: confirm
    goal: "Confirm the maze is solved by reading maze_status (audit envelope)."
    needs: [solver]
    steps:
      - "Run scripts/maze_status.sh from the project root."
      - "Emit envelope with data.solved, data.event_counts."
    run:
      skill: command_runner
    output_schema:
      ok: boolean
      solved: boolean
    verify:
      command: |
        python3 - <<'PY'
        import json
        with open("agent_output.json") as f:
            env = json.load(f)
        raise SystemExit(0 if env.get("data", {}).get("solved") is True else 1)
        PY
    retry: 1
